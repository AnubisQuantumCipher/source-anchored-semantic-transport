name: Matched source retrieval controls
on: [push, pull_request]
permissions:
  contents: read
jobs:
  retrieval:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.10'
          architecture: 'x64'
          check-latest: false
          allow-prereleases: false
      - name: Unchanged literal oracle and required FTS capability
        run: |
          python3 -I -S -B -Werror comparison/retrieval/run_tests.py
          python3 -I -S -B -O -Werror comparison/retrieval/run_tests.py
      - name: Source and retained observations
        run: |
          python3 -I -S -B -Werror comparison/retrieval/prepare_receipt.py --check
          python3 -I -S -B -Werror install/check_source.py
