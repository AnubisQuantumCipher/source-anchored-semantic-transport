name: Mandatory ML-DSA-87 manifest signing controls
on: [push, pull_request]
permissions:
  contents: read
jobs:
  actual-provider-and-signed-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SAST_MLDSA87_SOURCE: ${{ runner.temp }}/manifest-signing/source
      SAST_MLDSA87_BUILD: ${{ runner.temp }}/manifest-signing/normal
      SAST_MLDSA87_RNG_FAULT_ROOT: ${{ runner.temp }}/manifest-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.10'
          architecture: 'x64'
          check-latest: false
          allow-prereleases: false
      - name: Explicit additive source profile and public metadata readback
        run: |
          python3 -I -S -B -Werror tests/check_manifest_signing.py
          python3 -I -S -B -O -Werror tests/check_manifest_signing.py
          python3 -I -S -B -Werror examples/sentinel-v1-integration/readback.py --check
          python3 -I -S -B -O -Werror examples/sentinel-v1-integration/readback.py --check
      - name: Acquire sole exact upstream revision through bounded existing helper
        run: python3 -I -S -B -Werror examples/sentinel-v1-integration/ci_gate.py acquire
      - name: Build normal portable C provider using existing usr-bin-cc
        run: python3 -I -S -B -Werror examples/sentinel-v1-integration/ci_gate.py normal
      - name: Build explicit RNG failure before first call
        run: python3 -I -S -B -Werror examples/sentinel-v1-integration/ci_gate.py rng-fault-0
      - name: Build explicit RNG failure after first call
        run: python3 -I -S -B -Werror examples/sentinel-v1-integration/ci_gate.py rng-fault-1
      - name: Execute all 23 actual crypto controls without skips in both modes
        run: |
          python3 -I -S -B -Werror examples/sentinel-v1-integration/ci_gate.py crypto
          python3 -I -S -B -O -Werror examples/sentinel-v1-integration/ci_gate.py crypto
      - name: Execute all 22 mocked signed orchestration controls without skips in both modes
        run: |
          python3 -I -S -B -Werror examples/sentinel-v1-integration/ci_gate.py signed
          python3 -I -S -B -O -Werror examples/sentinel-v1-integration/ci_gate.py signed
