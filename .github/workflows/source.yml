name: Source and installer controls
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reproduce pinned source inventory
        run: python3 -I -S -B -Werror install/prepare_source.py --check
      - name: Bounded installer mechanics
        run: python3 -I -S -B -Werror install/test_install_support.py -v
      - name: Closed source and transformation controls
        run: python3 -I -S -B -Werror install/test_install_layout.py -v
      - name: Parse source and enforce installer function size
        run: python3 -I -S -B -Werror install/check_source.py
