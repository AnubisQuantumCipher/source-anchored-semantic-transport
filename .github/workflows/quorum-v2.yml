name: QUORUM threshold and replay evidence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quorum-v2-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.10'
          architecture: 'x64'
          check-latest: false
          allow-prereleases: false
      - name: Check source-bound retained evidence
        run: python3 -I -S -B -Werror examples/quorum-v2/coherence/check_continuity.py
      - name: Independent threshold oracle in isolated normal and optimized modes
        run: |
          gzip -dc examples/quorum-v2/oracle.json.gz > "$RUNNER_TEMP/quorum-oracle.json"
          python3 -I -S -B -Werror install/test_quorum_v2.py --oracle "$RUNNER_TEMP/quorum-oracle.json" --fixtures examples/quorum-v2/policy-inputs.zip --output "$RUNNER_TEMP/quorum-normal.json"
          python3 -I -S -B -O -Werror install/test_quorum_v2.py --oracle "$RUNNER_TEMP/quorum-oracle.json" --fixtures examples/quorum-v2/policy-inputs.zip --output "$RUNNER_TEMP/quorum-optimized.json"
          python3 -I -S -B -Werror install/test_quorum_v2_coherence.py
          python3 -I -S -B -O -Werror install/test_quorum_v2_coherence.py
