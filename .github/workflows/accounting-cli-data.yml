name: Verification evidence data
on: [push, pull_request]
permissions:
  contents: read
jobs:
  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.10'
          architecture: 'x64'
          check-latest: false
          allow-prereleases: false
      - name: Recheck bounded data membership and hashes without executing archived code
        run: |
          python3 -I -S -B -Werror comparison/accounting/cli-boundary-qualification/collate.py check
          python3 -I -S -B -O -Werror comparison/accounting/cli-boundary-qualification/collate.py check
          python3 -I -S -B -Werror examples/clean-proof-reproduction-v1/second/collate.py check
          python3 -I -S -B -O -Werror examples/clean-proof-reproduction-v1/second/collate.py check
          python3 -I -S -B -Werror examples/clean-proof-reproduction-v1/third/collate.py check
          python3 -I -S -B -O -Werror examples/clean-proof-reproduction-v1/third/collate.py check
          python3 -I -S -B -Werror examples/clean-proof-reproduction-v1/fourth/collate.py check
          python3 -I -S -B -O -Werror examples/clean-proof-reproduction-v1/fourth/collate.py check
          python3 -I -S -B -Werror examples/clean-proof-reproduction-v1/fifth/collate_qualification.py check
          python3 -I -S -B -O -Werror examples/clean-proof-reproduction-v1/fifth/collate_qualification.py check
