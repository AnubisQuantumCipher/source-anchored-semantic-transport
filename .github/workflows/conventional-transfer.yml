name: Conventional original-file transfer
on: [push, pull_request]
permissions:
  contents: read
jobs:
  transfer-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.10'
          architecture: 'x64'
          check-latest: false
          allow-prereleases: false
      - name: Conventional transfer controls and retained evidence identities
        run: |
          python3 -I -S -B -Werror comparison/transfer/test_transfer.py
          python3 -I -S -B -O -Werror comparison/transfer/test_transfer.py
          python3 -I -S -B -Werror comparison/transfer/receipt.py --check
