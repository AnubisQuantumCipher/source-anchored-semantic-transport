name: Independent export reader
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.10'
          architecture: 'x64'
          check-latest: false
          allow-prereleases: false
      - name: Prepare optimized standard-library cache without changing test controls
        run: |
          # The fixed imports below are stdlib only. -B controls still run unchanged.
          python3 -I -S -B -O -X importtime -Werror - <<'PY'
          import argparse, ast, contextlib, copy, errno, hashlib, importlib.util, io, json, locale, os, pathlib, re, resource, shutil, signal, stat, subprocess, sys, tempfile, textwrap, unittest, _colorize
          print({"phase": "before", "python": sys.version, "optimized_cache_exists": {m.__name__: os.path.isfile(m.__cached__) for m in (argparse, json, unittest)}})
          PY
          python3 -I -S -O -Werror -c 'import argparse, ast, contextlib, copy, errno, hashlib, importlib.util, io, json, locale, os, pathlib, re, resource, shutil, signal, stat, subprocess, sys, tempfile, textwrap, unittest, _colorize'
          python3 -I -S -B -O -X importtime -Werror - <<'PY'
          import argparse, ast, contextlib, copy, errno, hashlib, importlib.util, io, json, locale, os, pathlib, re, resource, shutil, signal, stat, subprocess, sys, tempfile, textwrap, unittest, _colorize
          print({"phase": "after", "python": sys.version, "optimized_cache_exists": {m.__name__: os.path.isfile(m.__cached__) for m in (argparse, json, unittest)}})
          PY
      - name: Independent reader controls and frozen export recovery
        run: |
          python3 -I -S -B -Werror install/test_export_reader.py --evidence-dir "$RUNNER_TEMP/reader-normal"
          python3 -I -S -B -O -Werror install/test_export_reader.py --evidence-dir "$RUNNER_TEMP/reader-optimized"
          python3 -I -S -B -Werror examples/independent-export-reader-v1/reproduce.py "$RUNNER_TEMP/export-reader-results"
      - name: Source and retained observation receipt
        run: |
          python3 -I -S -B -Werror install/check_source.py
          python3 -I -S -B -Werror examples/export-reader-ci-warmup/check_continuity.py
