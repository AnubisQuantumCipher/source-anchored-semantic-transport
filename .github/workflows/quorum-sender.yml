name: QUORUM sender checkpoint identities
on: [push, pull_request]
permissions:
  contents: read
jobs:
  receipt-and-bounds:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.10'
          architecture: 'x64'
          check-latest: false
          allow-prereleases: false
      - name: Bound new functions and verify retained source and observation pins
        run: python3 -I -S -B -Werror examples/quorum-sender-v1/receipt.py --check
