name: Public share presentation controls
on: [push, pull_request]
permissions:
  contents: read
jobs:
  presentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.10'
          architecture: 'x64'
          check-latest: false
          allow-prereleases: false
      - name: Literal presentation outcomes
        run: |
          python3 -I -S -B -Werror install/test_public_share.py
          python3 -I -S -B -O -Werror install/test_public_share.py
      - name: Source and retained observation receipt
        run: |
          python3 -I -S -B -Werror install/check_source.py
          python3 -I -S -B -Werror examples/public-share-v1/prepare_receipt.py --check
